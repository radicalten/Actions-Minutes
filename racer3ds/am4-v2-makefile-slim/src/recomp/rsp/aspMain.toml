# libultra's audio microcode (aspMain), recompiled to C++ by N64Recomp's RSPRecomp:
#   RSPRecomp rsp/aspMain.toml    (writes rsp/aspMain.cpp; generated from the ROM, never committed)
# Racer's copy is the stock one (identical to Pokemon Snap's): text at VRAM 0x80099450, data at
# 0x800AE5F0. The main segment maps VRAM 0x80000400 to ROM 0x1000.

text_offset = 0x9A050
text_size = 0xE20
text_address = 0x04001080
rom_file_path = "../baserom.z64"
output_file_path = "aspMain.cpp"
output_function_name = "aspMain"

# The audio command jump table (first 16 halfwords after the constants at the start of the ucode
# data, ROM 0xAF200): one handler per audio command, reached with jr.
extra_indirect_branch_targets = [
    0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
    0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C,
]
